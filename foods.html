<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foods</title>

  <!-- IMPORTANT: Firebase + Firestore scripts must already be in index.html -->
  <!-- foods.html will reuse the same global db + sync functions -->

  <script>
    /* -----------------------------------------
       LOAD FOOD DATABASE (cloud → local)
       ----------------------------------------- */

    async function loadFoods() {
      // Fallback if cloud has no data yet
      const defaultFoodDB = [];

      // Load cloud version (or upload fallback)
      window.foodDB = await loadSynced("mealPlanFoodDB_v4", defaultFoodDB);

      // Now render the foods list
      renderFoods();
    }

    /* -----------------------------------------
       SAVE FOOD DATABASE (local → cloud)
       ----------------------------------------- */

    function saveFoods() {
      localStorage.setItem("mealPlanFoodDB_v4", JSON.stringify(foodDB));
      syncToCloud("mealPlanFoodDB_v4", foodDB);   // NEW: cloud sync
    }

    /* -----------------------------------------
       RENDER + UI LOGIC
       ----------------------------------------- */

    function renderFoods() {
      const list = document.getElementById("foodsList");
      list.innerHTML = "";

      foodDB.forEach((item, index) => {
        const li = document.createElement("li");
        li.textContent = item.name;

        // Example delete button
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => {
          foodDB.splice(index, 1);
          saveFoods();     // cloud + local
          renderFoods();
        };

        li.appendChild(del);
        list.appendChild(li);
      });
    }

    /* -----------------------------------------
       ADD NEW FOOD ITEM
       ----------------------------------------- */

    function addFood() {
      const name = document.getElementById("newFood").value.trim();
      if (!name) return;

      foodDB.push({ name });
      saveFoods();     // cloud + local
      renderFoods();

      document.getElementById("newFood").value = "";
    }

    /* -----------------------------------------
       STARTUP
       ----------------------------------------- */

    window.addEventListener("DOMContentLoaded", loadFoods);
  </script>
</head>

<body>
  <h1>Foods</h1>

  <input id="newFood" placeholder="Add food">
  <button onclick="addFood()">Add</button>

  <ul id="foodsList"></ul>
</body>
</html>
