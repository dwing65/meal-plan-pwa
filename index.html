<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Plan PWA</title>

  <link rel="manifest" href="/manifest.json">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBDud5gxlssW0_rb-3IFhhE397QAEwvloQ",
      authDomain: "meal-plan-pwa-f27a2.firebaseapp.com",
      projectId: "meal-plan-pwa-f27a2",
      storageBucket: "meal-plan-pwa-f27a2.firebasestorage.app",
      messagingSenderId: "919710838019",
      appId: "1:919710838019:web:26e5ed5d4981821b998d36"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Cloud sync helpers
    async function syncToCloud(key, value) {
      await db.collection("pwaData").doc(key).set(
        {
          value,
          updatedAt: Date.now()
        },
        { merge: true }
      );
    }

    async function syncFromCloud(key) {
      const doc = await db.collection("pwaData").doc(key).get();
      if (!doc.exists) return null;
      return doc.data().value;
    }

    async function loadSynced(key, fallback) {
      const cloud = await syncFromCloud(key);
      if (cloud) {
        localStorage.setItem(key, JSON.stringify(cloud));
        return cloud;
      }
      syncToCloud(key, fallback);
      return fallback;
    }

    // Sync status UI helpers
    function setSyncStatus(text, color = "#4CAF50") {
      const el = document.getElementById("syncStatus");
      if (!el) return;
      el.textContent = text;
      el.style.background = color;
    }

    const originalSyncToCloud = syncToCloud;
    syncToCloud = async function (key, value) {
      setSyncStatus("Syncing...", "#FF9800");
      await originalSyncToCloud(key, value);
      setSyncStatus("Synced", "#4CAF50");
    };

    window.addEventListener("offline", () =>
      setSyncStatus("Offline", "#F44336")
    );
    window.addEventListener("online", () =>
      setSyncStatus("Online", "#4CAF50")
    );

    // App startup
    async function startApp() {
      const defaultFoodDB = [];
      const defaultMealPlanMulti = {};
      const defaultMealPlanVersion = 1;

      window.foodDB = await loadSynced("mealPlanFoodDB_v4", defaultFoodDB);
      window.mealPlanMulti = await loadSynced(
        "mealPlanMulti_v4",
        defaultMealPlanMulti
      );
      window.mealPlanVersion = await loadSynced(
        "mealPlanVersion",
        defaultMealPlanVersion
      );

      setSyncStatus("Synced", "#4CAF50");
      console.log("Loaded data:", {
        foodDB,
        mealPlanMulti,
        mealPlanVersion
      });
    }

    window.addEventListener("DOMContentLoaded", startApp);

    // Register service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js")
          .then(reg => console.log("SW registered", reg.scope))
          .catch(err => console.error("SW registration failed", err));
      });
    }
  </script>

  <style>
    body { font-family: sans-serif; margin: 0; padding: 1rem; }
    #syncStatus {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: #4CAF50;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <header style="
    text-align:center;
    padding:20px 0;
    background:#4CAF50;
    color:white;
    font-size:24px;
    font-weight:bold;
  ">
    Meal Plan PWA
  </header>

  <main style="
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:20px;
    max-width:500px;
    margin:0 auto;
  ">

    <!-- Foods Card -->
    <a href="/foods.html" style="
      display:block;
      background:white;
      border-radius:12px;
      padding:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      text-decoration:none;
      color:#333;
    ">
      <h2 style="margin:0 0 10px 0;">Foods</h2>
      <p style="margin:0; color:#666;">Manage your food database</p>
    </a>

    <!-- History Card -->
    <a href="/history.html" style="
      display:block;
      background:white;
      border-radius:12px;
      padding:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      text-decoration:none;
      color:#333;
    ">
      <h2 style="margin:0 0 10px 0;">History</h2>
      <p style="margin:0; color:#666;">View your logged meals</p>
    </a>

    <!-- Meal Plan Card -->
    <a href="/mealplan.html" style="
      display:block;
      background:white;
      border-radius:12px;
      padding:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      text-decoration:none;
      color:#333;
    ">
      <h2 style="margin:0 0 10px 0;">Meal Plan</h2>
      <p style="margin:0; color:#666;">Build and edit your meal plan</p>
    </a>

  </main>

  <!-- Sync Status Indicator -->
  <div id="syncStatus" style="
    position:fixed;
    bottom:10px;
    right:10px;
    background:#4CAF50;
    color:white;
    padding:6px 12px;
    border-radius:6px;
    font-size:14px;
    opacity:0.9;
  ">
    Synced
  </div>
</body>
</html>
